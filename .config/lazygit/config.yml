notARepository: 'quit'
promptToReturnFromSubprocess: false
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
os:
  editPreset: nvim
gui:
  showBottomLine: false
  border: rounded
  nerdFontsVersion: '3'
  skipDiscardChangeWarning: true
keybinding:
  files:
    commitChangesWithoutHook: <disabled>
customCommands:
  - key: w
    prompts:
      - type: input
        title: Commit summary
        initialValue: ''
    description: Commit changes without pre-commit hook
    command: git commit -n -m '{{index .PromptResponses 0}}'
    context: files
  - key: i
    description: Install deps and copy env files into the selected worktree
    command: $HOME/.local/bin/worktree-init '{{ .SelectedWorktree.Path }}'
    context: worktrees
    output: terminal
