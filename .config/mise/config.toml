[tools]
# CLI tools (prebuilt-binary backends so no platform needs a compiler)
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:JanDeDobbeleer/oh-my-posh" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:astral-sh/uv" = "latest"
"aqua:cli/cli" = "latest"
"aqua:go-task/task" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"

# dev tooling / language servers / formatters
ast-grep = "latest"
biome = "latest"
dprint = "latest"
go = "latest"
gofumpt = "latest"
golangci-lint = "latest"
golangci-lint-langserver = "latest"
lua-language-server = "latest"
node = "latest"
shfmt = "latest"
stylua = "latest"
sqlc = "latest"

"npm:@tailwindcss/language-server" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:oxfmt" = "latest"
"npm:prettier" = "latest"
"npm:svelte-language-server" = "latest"
"npm:typescript" = "latest"
"npm:typescript-svelte-plugin" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
npm.package_manager = "npm"

[settings.github]
use_git_credentials = true
